name: Tests and reproducible forecasting
on: [push, pull_request]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m leo_agent_study forecast --output /tmp/forecast
      - run: python scripts/compare_numeric.py results/forecast/forecast_report.json /tmp/forecast/forecast_report.json
      - run: python scripts/compare_numeric.py results/forecast/forecasts.csv /tmp/forecast/forecasts.csv
      - run: PYTHONPATH=src python -m leo_agent_study synthetic --output /tmp/synthetic
      - run: python scripts/compare_numeric.py results/synthetic/summary.json /tmp/synthetic/summary.json
      - run: python scripts/compare_numeric.py results/synthetic/runs.csv.gz /tmp/synthetic/runs.csv.gz
