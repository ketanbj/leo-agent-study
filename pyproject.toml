[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-agent-study"
version = "0.1.1"
description = "A reproducible preliminary study of LEO forecasting and agent timing headroom"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leo-agent-study = "leo_agent_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
